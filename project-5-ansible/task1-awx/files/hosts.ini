# On-prem Vagrant stack (Lecture 2). Same IPs as project-1-manual.
# From awx01 (192.168.56.20) these are on the same host-only network.

[onprem]
web01 ansible_host=192.168.56.11
app01 ansible_host=192.168.56.12
rmq01 ansible_host=192.168.56.13
mc01  ansible_host=192.168.56.14
db01  ansible_host=192.168.56.15

[onprem:vars]
ansible_user=vagrant
ansible_ssh_pass=vagrant
ansible_become=true
ansible_become_pass=vagrant
ansible_ssh_common_args=-o StrictHostKeyChecking=no
