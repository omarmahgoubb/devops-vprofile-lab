defaultDashboardsEnabled: false

grafana:
  service:
    type: NodePort
    nodePort: 30083
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 6h
    retentionSize: 2GB
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 2Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
